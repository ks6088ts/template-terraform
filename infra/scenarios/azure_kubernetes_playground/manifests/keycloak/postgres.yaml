apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-db
  labels:
    app.kubernetes.io/name: postgresql-db
    app.kubernetes.io/part-of: keycloak-workshop
spec:
  serviceName: postgres-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql-db
        app.kubernetes.io/part-of: keycloak-workshop
    spec:
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: password
            - name: POSTGRES_DB
              value: keycloak
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  labels:
    app.kubernetes.io/name: postgresql-db
    app.kubernetes.io/part-of: keycloak-workshop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
