apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-sample
  labels:
    app.kubernetes.io/name: tls-sample
    app.kubernetes.io/part-of: azure-kubernetes-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tls-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tls-sample
        app.kubernetes.io/part-of: azure-kubernetes-playground
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tls-sample
  labels:
    app.kubernetes.io/name: tls-sample
    app.kubernetes.io/part-of: azure-kubernetes-playground
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tls-sample
  ports:
    - name: http
      port: 80
      targetPort: http
