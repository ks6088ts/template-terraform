name: infracost

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read

env:
  INFRACOST_SCANNER_VERSION: 0.2.10

concurrency:
  group: infracost-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Resolve pull request base
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          base_ref=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          echo "base-ref=$base_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout head
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pull_request_number }}/head
          path: head
      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.base-ref }}
          path: base
      - name: Report cost diff
        uses: infracost/actions/diff@fb736a8f219195d6efdca58682069b16fe1bc280 # v4.2.0
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: ${{ env.INFRACOST_SCANNER_VERSION }}
          base-path: base
          head-path: head
          pr-number: ${{ inputs.pull_request_number }}
