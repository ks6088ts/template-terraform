name: infracost

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

env:
  INFRACOST_VERSION: 2.16.2

concurrency:
  group: infracost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cost:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Install Infracost
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="infracost-linux-amd64.tar.gz"
          gh release download "v${INFRACOST_VERSION}" \
            --repo infracost/cli \
            --pattern "$archive" \
            --pattern "$archive.sha256" \
            --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum --check "$archive.sha256"
          tar -xzf "$archive"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Estimate costs
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_API_KEY }}
        run: make cost
