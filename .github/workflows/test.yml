name: test

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "copilot/**"
  schedule:
    - cron: "00 00 * * 3"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TERRAFORM_VERSION: 1.16.4
  TFLINT_VERSION: v0.64.0
  TRIVY_VERSION: v0.74.0
  ACTIONLINT_VERSION: 1.7.12

jobs:
  # Lint and security scan (no auth required)
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Install actionlint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run lint and security scan
        run: |
          make tflint trivy actionlint
      - name: Test provider update workflow without network access
        run: sh scripts/tests/test_update.sh

  # Test scenarios without authentication (hello_world, etc.)
  test-misc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - hello_world
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Run misc scenario test (${{ matrix.scenario }})
        run: |
          echo "Test: ${{ matrix.scenario }}"
          make _ci-test-base SCENARIO=${{ matrix.scenario }}

  # Test AWS scenarios (aws_*)
  test-aws:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - aws_github_oidc
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ap-northeast-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Run AWS scenario test (${{ matrix.scenario }})
        run: |
          echo "Test: ${{ matrix.scenario }}"
          make _ci-test-base SCENARIO=${{ matrix.scenario }}

  # Test Azure scenarios (azure_*)
  test-azure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - azure_apim_playground
          - azure_container_apps
          - azure_cosmosdb_playground
          - azure_databricks_workspace
          - azure_datastore
          - azure_functions_flex_consumption
          # FIXME: data.azuread_service_principal requires Microsoft Graph permissions that are not available under our current test setup, so skipping for now
          # - azure_github_oidc
          - azure_inclusive_ai_labs
          - azure_messaging
          - azure_microsoft_foundry
          - azure_observability
          - azure_hub_spoke
          - azure_terraform_backend
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_USE_OIDC: ${{ secrets.ARM_USE_OIDC }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Run Azure scenario test (${{ matrix.scenario }})
        run: |
          echo "Test: ${{ matrix.scenario }}"
          make _ci-test-base SCENARIO=${{ matrix.scenario }}
      - name: Run Databricks workspace module mock tests
        if: matrix.scenario == 'azure_databricks_workspace'
        env:
          TF_DATA_DIR: ${{ runner.temp }}/databricks-workspace-module
        run: |
          terraform -chdir=infra/modules/azure/databricks_workspace init -backend=false -input=false
          terraform -chdir=infra/modules/azure/databricks_workspace fmt -check
          terraform -chdir=infra/modules/azure/databricks_workspace validate
          terraform -chdir=infra/modules/azure/databricks_workspace test
      - name: Run private connectivity module tests
        if: matrix.scenario == 'azure_hub_spoke'
        run: |
          for module in private_endpoint storage; do
            terraform -chdir="infra/modules/azure/$module" init -backend=false
            terraform -chdir="infra/modules/azure/$module" validate
            terraform -chdir="infra/modules/azure/$module" test
          done
      - name: Run private Blob validation script tests
        if: matrix.scenario == 'azure_hub_spoke'
        run: bash infra/scenarios/azure_hub_spoke/scripts/tests/test_validation.sh
      - name: Run Microsoft Foundry offline script tests
        if: matrix.scenario == 'azure_microsoft_foundry'
        run: sh infra/scenarios/azure_microsoft_foundry/scripts/tests/test_scripts.sh
      - name: Run Microsoft Foundry module tests
        if: matrix.scenario == 'azure_microsoft_foundry'
        run: |
          terraform -chdir=infra/modules/azure/microsoft_foundry init -backend=false
          terraform -chdir=infra/modules/azure/microsoft_foundry test
      - name: Run observability module tests
        if: matrix.scenario == 'azure_observability'
        run: |
          for module in log_analytics network_watcher activity_log monitor_action_group monitor_activity_log_alert monitor_workbook; do
            terraform -chdir="infra/modules/azure/$module" init -backend=false
            terraform -chdir="infra/modules/azure/$module" validate
            terraform -chdir="infra/modules/azure/$module" test
          done

  # Test Google scenarios (google_*)
  test-google:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - google_github_oidc
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Run Google scenario test (${{ matrix.scenario }})
        run: |
          echo "Test: ${{ matrix.scenario }}"
          make _ci-test-base SCENARIO=${{ matrix.scenario }}

  # Validate Databricks reads without credentials or a real workspace.
  test-databricks-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    permissions:
      contents: read
    env:
      TF_INPUT: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Run Databricks scenario mock tests
        env:
          TF_DATA_DIR: ${{ runner.temp }}/databricks-scenario
        run: |
          terraform -chdir=infra/scenarios/databricks_playground init -backend=false -lockfile=readonly -input=false
          terraform -chdir=infra/scenarios/databricks_playground fmt -check -recursive
          terraform -chdir=infra/scenarios/databricks_playground validate
          terraform -chdir=infra/scenarios/databricks_playground test
      - name: Run Databricks dashboards module mock tests
        env:
          TF_DATA_DIR: ${{ runner.temp }}/databricks-module
        run: |
          terraform -chdir=infra/modules/databricks/dashboards init -backend=false -input=false
          terraform -chdir=infra/modules/databricks/dashboards fmt -check -recursive
          terraform -chdir=infra/modules/databricks/dashboards validate
          terraform -chdir=infra/modules/databricks/dashboards test
      - name: Run Databricks local API fixture tests
        run: sh infra/modules/databricks/dashboards/tests/test_fixture_api.sh

  # Validate Cloudflare scenarios without credentials or API calls.
  test-cloudflare-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    permissions:
      contents: read
    env:
      TF_INPUT: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Run Cloudflare scenario mock tests
        env:
          TF_DATA_DIR: ${{ runner.temp }}/cloudflare-scenario
        run: |
          terraform -chdir=infra/scenarios/cloudflare_account init -backend=false -lockfile=readonly -input=false
          terraform -chdir=infra/scenarios/cloudflare_account fmt -check
          terraform -chdir=infra/scenarios/cloudflare_account validate
          terraform -chdir=infra/scenarios/cloudflare_account test
      - name: Run Cloudflare account module mock tests
        env:
          TF_DATA_DIR: ${{ runner.temp }}/cloudflare-module
        run: |
          terraform -chdir=infra/modules/cloudflare/account init -backend=false -input=false
          terraform -chdir=infra/modules/cloudflare/account fmt -check
          terraform -chdir=infra/modules/cloudflare/account validate
          terraform -chdir=infra/modules/cloudflare/account test

  # Read the real Cloudflare API; credentials remain mandatory.
  test-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test-cloudflare-mock
    environment: dev
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - cloudflare_account
    env:
      TF_INPUT: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Run Cloudflare read-only plan (${{ matrix.scenario }})
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in the dev environment secrets."
            exit 1
          fi
          if [ -z "$TF_VAR_account_id" ]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID in the dev environment secrets."
            exit 1
          fi
          echo "Test: ${{ matrix.scenario }}"
          make init lint plan SCENARIO=${{ matrix.scenario }}

  # Test GitHub scenarios (github_*)
  test-github:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - github_secrets
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Run GitHub scenario test (${{ matrix.scenario }})
        run: |
          echo "Test: ${{ matrix.scenario }}"
          make _ci-test-base SCENARIO=${{ matrix.scenario }}
